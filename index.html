    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

        }

        .nav {
            max-width: 1200px;
            margin: auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            color: #16a05d;
            white-space: nowrap;
        }

        .logo span {
            color: #ff9f1c;
        }

        .menu {
            display: flex;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
        }

        .menu a {
            color: #37474f;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #e8f8ef;
            color: #159957;
        }

        /* ================= HERO ================= */
        .hero {
            background: linear-gradient(135deg, #0d9f5b, #20c879);
            color: white;
            padding: 75px 20px 95px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -120px;
            left: -80px;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            bottom: -130px;
            right: -70px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
            margin: auto;
        }

        .hero h1 {
            font-size: 43px;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .hero p {
            font-size: 19px;
            opacity: 0.95;
            max-width: 700px;
            margin: auto;
        }

        .hero-btn {
            display: inline-block;
            margin-top: 28px;
            background: white;
            color: #119957;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .hero-btn:hover {
            transform: translateY(-3px);
        }

        /* ================= SEARCH ================= */
        .search-area {
            max-width: 650px;
            margin: -35px auto 45px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: white;
            padding: 8px;
            border-radius: 50px;
            display: flex;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 13px 20px;
            font-size: 16px;
            border-radius: 40px;
            min-width: 0;
        }

        .search-box button {
            border: none;
            background: #16a05d;
            color: white;
            padding: 0 23px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #087f48;
        }

        /* ================= MAIN ================= */
        .container {
            max-width: 1150px;
            margin: auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title h2 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .section-title p {
            color: #78909c;
        }

        .section-title .line {
            width: 60px;
            height: 4px;
            background: #16a05d;
            border-radius: 10px;
            margin: 12px auto;
        }

        /* ================= CARDS ================= */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
            border: 1px solid #edf2ef;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.10);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: auto auto 18px;
            border-radius: 18px;
            background: #e8f8ef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 31px;
        }

        .card h3 {
            font-size: 19px;
            margin-bottom: 10px;
        }

        .card p {
            color: #718096;
            font-size: 14px;
            min-height: 70px;
        }

        .btn {
            display: inline-block;
            margin-top: 18px;
            background: #16a05d;
            color: white;
            padding: 9px 19px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
        }

            background: #087f48;
        }

        /* ================= FOOTER ================= */

            color: #dce8e2;
            margin-top: 70px;
            padding: 45px 20px 20px;
            text-align: center;
        }
        footer p {
            font-size: 14px;
            opacity: 0.8;
        }
